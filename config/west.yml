manifest:
  defaults:
    revision: main
    remote: urob

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    - name: janpfischer
      url-base: https://github.com/janpfischer

    - name: urob
      url-base: https://github.com/urob

    - name: caksoylar
      url-base: https://github.com/caksoylar

    - name: englmaxi
      url-base: https://github.com/englmaxi

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    - name: zmk-helpers
    - name: zmk-unicode
    - name: zmk-tri-state

    - name: zmk-dongle-screen
      remote: janpfischer

    - name: zmk-rgbled-widget
      remote: caksoylar

    - name: zmk-dongle-display
      remote: englmaxi
      revision: v0.3 # use 'v0.3' instead of 'main' if you use have pinned zmk to 'v0.3' or below

  self:
    path: config
